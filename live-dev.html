<!doctype html>
<!-- Dev harness for the live scene with a fake world (src/live/dev.js).
     Served by vite in dev, excluded from the production build. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrarium · live dev</title>
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #14241F; }
    .lv-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .lv-canvas:active { cursor: grabbing; }
    .lv-dev {
      position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      font: 400 14px/1.3 var(--font-text); color: var(--fog); font-variant-numeric: tabular-nums;
      padding: 8px 12px; border-radius: 12px; background: rgb(20 36 31 / 0.55); backdrop-filter: blur(8px);
      max-width: calc(100vw - 56px);
    }
    .lv-dev button {
      font: inherit; color: inherit; background: transparent; border: 1px solid rgb(201 216 210 / 0.35);
      border-radius: 999px; padding: 2px 10px; cursor: pointer;
    }
    .lv-dev button[aria-pressed="true"] { background: var(--lichen); color: var(--moss); border-color: var(--lichen); }
    .lv-dev__hint { opacity: 0.7; width: 100%; }
  </style>
</head>
<body>
  <canvas class="lv-canvas"></canvas>
  <div class="lv-dev">
    <span>Speed</span>
    <button type="button" data-speed="1">1x</button>
    <button type="button" data-speed="4">4x</button>
    <button type="button" data-speed="16">16x</button>
    <span class="lv-dev__ms">…</span>
    <span class="lv-dev__hint">Drag to turn the jar, scroll to zoom, click a creature to follow it, Esc to let go</span>
  </div>
  <script type="module" src="/src/live/dev.js"></script>
</body>
</html>
